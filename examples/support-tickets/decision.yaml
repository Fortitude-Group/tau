# Tau worked example: support-ticket urgency on SYNTHETIC tickets (CC-BY-NC-4.0; no rows are committed).
name: support-tickets
title: "Synthetic support tickets: how urgent is this ticket?"
question:
  key: urgency
  type: score
  instructions: "How urgent is this customer support ticket?"
  options:
    - "very low: no time pressure, informational or cosmetic"
    - "low: minor issue, can wait several days"
    - "medium: needs attention within a day or two"
    - "high: significant impact, needs attention today"
    - "critical: outage, security or data-loss risk, needs immediate attention"
data:
  dataset: tickets
  text_field: text
  label_field: label
  reference: frontier                # the synthetic gold labels are close to arbitrary (docs/DECISIONS.md): score against the frontier's answers
endpoint: http://localhost:18093
models: [laya-en, laya-typed-decisions, von-1.2.0, laya-en-ft-tickets]
external:                            # hosted endpoints measured alongside the local models, over the network
  - id: jev-1.13                     # the name used in reports and run folders
    endpoint: https://api.typesafe.ai
    model: jev-latest                # the request's model field
    api_key_env: TYPESAFE_API_KEY    # read at run time (process, then Windows User scope); never written anywhere
    price_usd_per_mtok: { input: 0.042, output: 0 }   # for the spend guard and the cost table: an estimate
    budget_usd: 1.00                 # hard stop: the measure blocks (exit 2) before spend would pass this
    concurrency: 4
baselines: [minilm-l6-tickets]
threshold:
  target_error: 0.20
frontier:
  model: claude-opus-5-5
  prompt_version: v1
  alt_prompt_version: v1-alt
  alt_subset: 200
pricing:
  basis_date: "2026-09-27"
  source: "https://platform.claude.com/docs/en/about-claude/pricing (checked 2026-09-27)"
  usd_per_mtok:                      # [input, output] list prices, USD per million tokens
    claude-opus-5-5: [4, 20]
    claude-opus-5-5-batch: [2, 10]
    claude-sonnet-5: [2, 10]
    claude-haiku-4-5: [1, 5]
  headline: claude-opus-5-5          # the model that produced the frontier answers
  gbp_per_usd: 0.75458               # ECB reference rates 2026-09-25: GBP 0.86045 / USD 1.1403 per EUR
  gbp_per_usd_source: "ECB euro foreign exchange reference rates, 2026-09-25"
  electricity_gbp_per_kwh: 0.2632    # Ofgem price cap, 1 Oct to 31 Dec 2026, Direct Debit average; page says it excludes VAT
  electricity_source: "https://www.ofgem.gov.uk/news/changes-energy-price-cap-between-1-october-and-31-december-2026"
  tokenizer_factor: 1.3              # Claude 4.7+ tokenizer: about 30% more tokens than the chars/4 rule of thumb
