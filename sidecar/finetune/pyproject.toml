[project]
name = "tau-sidecar"
version = "0.1.0"
description = "Tau sidecar: ONNX export, reference runners and parity fixtures for Laya and Von."
license = "Apache-2.0"
requires-python = "==3.12.*"
dependencies = [
    "torch>=2.6",
    "transformers>=5.0,<6",
    "laya==0.3.20",
    "von-sdk==1.2.3",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.2",
    "safetensors>=0.4",
    "huggingface_hub>=0.25",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
